name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        shell: pwsh
        run: python tests/test_components.py

      - name: Bootstrap (Clear model + Voz node modules)
        shell: pwsh
        run: python scripts/bootstrap.py

      - name: Bundle a Node runtime for the Voz engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/engine/voz_node/bin | Out-Null
          Copy-Item (Get-Command node).Source src/engine/voz_node/bin/node.exe

      - name: Build Takt.exe with PyInstaller
        shell: pwsh
        run: pyinstaller Takt.spec --noconfirm --clean

      - name: Compile C# utilities
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $zipRefs = @("/reference:System.IO.Compression.FileSystem.dll", "/reference:System.IO.Compression.dll")
          $icon = "/win32icon:assets\takt.ico"
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "0.0.0-dev" }
          python scripts/write_build_info.py --version $version
          if ($LASTEXITCODE -ne 0) { throw "write_build_info.py failed" }
          & $csc /nologo /target:winexe $icon "/out:dist\Takt\TaktSettings.exe" scripts\TaktSettingsLauncher.cs
          if ($LASTEXITCODE -ne 0) { throw "TaktSettings.exe failed to compile" }
          & $csc /nologo /target:winexe $icon "/out:dist\Takt\TaktUpdate.exe" @zipRefs scripts\TaktUpdate.cs
          if ($LASTEXITCODE -ne 0) { throw "TaktUpdate.exe failed to compile" }
          & $csc /nologo /target:winexe $icon "/out:dist\Takt\Uninstall.exe" scripts\Uninstall.cs
          if ($LASTEXITCODE -ne 0) { throw "Uninstall.exe failed to compile" }
          & $csc /nologo /target:winexe $icon "/out:dist\TaktSetup.exe" @zipRefs scripts\TaktSetup.cs scripts\BuildInfo.g.cs
          if ($LASTEXITCODE -ne 0) { throw "TaktSetup.exe failed to compile" }

      - name: Package Takt-Windows-x64.zip
        shell: pwsh
        run: |
          Copy-Item SYSTEM_REQUIREMENTS.md dist\Takt\
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\TaktSetup.exe release\
          Copy-Item dist\Takt release\Takt -Recurse
          Compress-Archive -Path release\* -DestinationPath Takt-Windows-x64.zip -CompressionLevel Optimal
          Get-Item Takt-Windows-x64.zip | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Takt-Windows-x64
          path: Takt-Windows-x64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Takt-Windows-x64.zip
            dist/TaktSetup.exe
          generate_release_notes: true
